# Dedicated Postgres + Redis for webmcp-computer.
# Both bound to host loopback only; the API + auth (host systemd services)
# connect via 127.0.0.1. The API's migration runner (apps/api/src/migrate.ts) is
# the authoritative schema owner; the initdb mount only seeds a brand-new volume.
name: webmcp-computer
services:
  postgres:
    image: postgres:16-alpine
    container_name: webmcp-computer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: webmcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: webmcp
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - webmcp-computer-pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webmcp -d webmcp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: webmcp-computer-redis
    restart: unless-stopped
    # appendonly so session/revocation state survives a restart on this host.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - webmcp-computer-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  webmcp-computer-pgdata:
    name: webmcp-computer-pgdata
  webmcp-computer-redisdata:
    name: webmcp-computer-redisdata
