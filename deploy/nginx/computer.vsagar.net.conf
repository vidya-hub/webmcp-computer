# Public vhost for computer.vsagar.net, reached ONLY via the cloudflared tunnel
# (ingress computer.vsagar.net -> http://localhost:80). The control plane is no
# longer unauthenticated: AUTH_REQUIRED=true gates every /api and /desktops
# request, and the SPA shows a login screen. TLS is terminated at Cloudflare
# (SSL Full: CF->origin is this HTTP tunnel), so no HSTS here.
#
# The `authlogin` limit_req zone and the `$csp_app` map are defined once in
# computer-tailscale.conf (same http context) and reused here.
server {
  listen 80;
  server_name computer.vsagar.net;

  root /var/www/computer.vsagar.net;
  index index.html;

  # Home-archive restore payloads can be large.
  client_max_body_size 512m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/css
    application/javascript
    application/json
    image/svg+xml
    font/woff2;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "unload=*, tools=(self)" always;

  location = /auth/login {
    limit_req zone=authlogin burst=5 nodelay;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location /auth/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ~ ^/(api|desktops)/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "unload=*, tools=(self)" always;
    add_header Content-Security-Policy $csp_app always;
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "unload=*, tools=(self)" always;
    add_header Content-Security-Policy $csp_app always;
    try_files $uri $uri/ /index.html;
  }
}
