# The control plane (spawn / approve / VNC proxy) is UNAUTHENTICATED. It must
# never be exposed on a public, plaintext port. Access is tailnet-only via
# Tailscale Serve (see computer-tailscale.conf + deploy/README.md).
#
# This vhost used to serve the app on public :80. It now returns 404 for
# everything so a stale public A record can't reach the API. Delete the file
# and reload nginx if you want the port fully closed instead.
server {
  listen 80;
  server_name computer.vsagar.net;

  # Do not proxy to the API and do not serve the SPA on this public port.
  return 404;
}
