# Root-path app listener for Tailscale Serve (https://vidyaoracle.tailc57b59.ts.net/).
# Tailscale proxies to this loopback port; default_server so any Host matches.
server {
  listen 127.0.0.1:8091 default_server;
  server_name _;

  root /var/www/computer.vsagar.net;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~ ^/(api|desktops)/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
