# picom on Xtigervnc — xrender has no GL dependency and is reliable in this image.
# Rounded corners are declared here; xrender may ignore them on older picom.
backend = "xrender";
vsync = false;
unredir-if-possible = false;

corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'"
];

shadow = true;
shadow-radius = 18;
shadow-offset-x = 0;
shadow-offset-y = 8;
shadow-opacity = 0.45;
shadow-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 10;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;

wintypes: {
  desktop = { shadow = false; corner-radius = 0; }
  dock = { shadow = true; corner-radius = 0; }
  tooltip = { fade = true; shadow = true; }
  menu = { shadow = true; }
  popup_menu = { shadow = true; }
  dropdown_menu = { shadow = true; }
};
