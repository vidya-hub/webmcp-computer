# Root-path app listener for Tailscale Serve (https://vidyaoracle.tailc57b59.ts.net/).
# Tailscale proxies to this loopback port; default_server so any Host matches.
# TLS is terminated by Tailscale Serve, so no HSTS here (this is plain :8091).

# Rate-limit login attempts (per client IP). 5/min with a small burst.
limit_req_zone $binary_remote_addr zone=authlogin:1m rate=5r/m;

# Security headers, applied per response. nginx drops inherited add_header when a
# location defines its own, so the CSP-bearing document locations re-declare them.
map $sent_http_content_type $csp_app {
  default "default-src 'self'; frame-src 'self'; frame-ancestors 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'";
}

server {
  listen 127.0.0.1:8091 default_server;
  server_name _;

  root /var/www/computer.vsagar.net;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/css
    application/javascript
    application/json
    image/svg+xml
    font/woff2;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "unload=*, tools=(self)" always;

  # Auth service (cookies, login). Exact /auth/login is rate-limited.
  location = /auth/login {
    limit_req zone=authlogin burst=5 nodelay;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location /auth/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Control plane + desktop stream (WebSocket upgrade preserved).
  location ~ ^/(api|desktops)/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # Vite hashes asset filenames, so they can be cached forever.
  location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The SPA document carries the CSP (CSP is enforced per-document).
  location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "unload=*, tools=(self)" always;
    add_header Content-Security-Policy $csp_app always;
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "unload=*, tools=(self)" always;
    add_header Content-Security-Policy $csp_app always;
    try_files $uri $uri/ /index.html;
  }
}
